
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBuy | Product Comparison</title>
</head>
<body>
    <h1>SmartBuy</h1>
    <h2>Find the best product for your money.</h2>

    <p>
        Compare prices, ratings, reviews, and availability
        across multiple stores.
    </p>

    <form action="/search" method="get">
        <label for="product">Search for a product:</label>
        <input
            type="text"
            id="product"
            name="product"
            placeholder="e.g. Samsung Galaxy S25"
            required
        >
        <button type="submit">Compare Products</button>
    </form>
</body>
</html>
